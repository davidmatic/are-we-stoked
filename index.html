<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>are we stoked?</title>
    <style>
      body {
        font-family: ui-monospace, Menlo, Consolas, monospace;
        margin: 3rem 1rem;
        background: #fff;
        color: #111;
      }
      @media (prefers-color-scheme: dark) {
        body { background: #111; color: #eee; }
        a { color: #9cf; }
      }
      main { max-width: 40rem; margin: 0 auto; }
      h1 { font-size: 1.5rem; font-weight: normal; margin-bottom: 2rem; }
      pre { font: inherit; line-height: 1.6; white-space: pre-wrap; }
      footer { margin-top: 3rem; font-size: 0.8rem; opacity: 0.6; }
    </style>
  </head>
  <body>
    <main>
      <h1>are we stoked?</h1>
      <pre id="resorts"></pre>
      <footer>
        data: <a href="https://www.weather.gov/slc/">national weather service</a>
        · next 48 hours
      </footer>
    </main>
    <script type="module">
      import { resortStoke } from "./stoke.js";

      // Grouped by Area; each Resort uses its on-mountain NWS gridpoint.
      const areas = [
        [
          ["alta", "SLC/108,167"],
          ["snowbird", "SLC/107,166"],
          ["brighton", "SLC/110,167"],
          ["solitude", "SLC/110,168"],
        ],
        [
          ["park city mountain", "SLC/111,169"],
          ["deer valley", "SLC/114,168"],
        ],
        [
          ["snowbasin", "SLC/104,195"],
          ["powder mountain", "SLC/107,203"],
        ],
      ];

      const width = Math.max(...areas.flat().map(([name]) => name.length)) + 3;
      const stokes = new Map(areas.flat().map(([name]) => [name, "..."]));

      function render() {
        document.getElementById("resorts").textContent = areas
          .map((resorts) =>
            resorts
              .map(([name]) => name.padEnd(width) + stokes.get(name))
              .join("\n"),
          )
          .join("\n\n");
      }

      render();
      const now = new Date();
      for (const [name, gridpoint] of areas.flat()) {
        resortStoke(gridpoint, now, fetch).then((stoke) => {
          stokes.set(name, stoke);
          render();
        });
      }
    </script>
  </body>
</html>
