<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>are we stoked?</title>
    <style>
      body {
        font-family: ui-monospace, Menlo, Consolas, monospace;
        /* Shrink on narrow screens so the longest line (46 chars, 12 o's) still fits. */
        font-size: min(1rem, calc((100vw - 2rem) / 28));
        margin: 1rem;
        background: #fff;
        color: #000;
      }
      /* Dark mode is a green-on-black terminal. */
      @media (prefers-color-scheme: dark) {
        body { background: #000; color: #33ff66; }
        a, footer { color: #1f9e45; }
      }
      pre { font: inherit; line-height: 1.6; margin: 0; }
      footer { margin-top: 2rem; font-size: 0.8rem; color: #888; }
    </style>
  </head>
  <body>
    <pre id="resorts"></pre>
    <footer>
      data: <a href="https://www.weather.gov/slc/">national weather service</a>
      · next 48 hours
    </footer>
    <script type="module" src="page.js"></script>
  </body>
</html>
